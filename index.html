<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 Retro Pixel Racer - Curvas e Obstáculos</title>
    <style>
        body {
            background-color: #121214;
            color: #e1e1e6;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        h1 {
            margin: 0 0 5px 0;
            color: #f75a68;
            text-shadow: 2px 2px #000;
            font-size: 24px;
        }

        #ui {
            display: flex;
            gap: 20px;
            font-size: 16px;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .hud-item {
            background: #202024;
            padding: 5px 12px;
            border-radius: 4px;
            border: 2px solid #323238;
        }

        #game-container {
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
            border: 4px solid #29292e;
            border-radius: 6px;
            background-color: #388e3c;
        }

        canvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
    </style>
</head>
<body>

    <h1>🏎️ F1 PIXEL RACER: CURVAS & OBSTÁCULOS 🚧</h1>
    <div id="ui">
        <div class="hud-item">Velocidade: <span id="speed">0</span> KM/H</div>
        <div class="hud-item">Distância: <span id="distance">0</span> m</div>
    </div>

    <div id="game-container">
        <canvas id="gameCanvas" width="240" height="320"></canvas>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const speedDisplay = document.getElementById("speed");
        const distanceDisplay = document.getElementById("distance");

        const keys = {};
        window.addEventListener("keydown", e => keys[e.key] = true);
        window.addEventListener("keyup", e => keys[e.key] = false);

        let gameState = "START";
        let scoreDistance = 0;
        let roadSpeed = 3;
        
        let player = {
            x: 105,
            y: 240,
            width: 14,
            height: 24,
            speed: 0,
            maxSpeed: 6.5,
            steerSpeed: 2.6
        };

        // Estrutura da Pista
        let baseRoadLeft = 50;
        let baseRoadRight = 190;
        let roadSegments = []; // Armazenará as curvas por linhas da tela
        let segmentLength = 10;
        let totalSegments = canvas.height / segmentLength + 5;
        let trackOffset = 0; // Controla o deslocamento global da pista

        let obstacles = [];
        let enemies = [];
        let spawnTimer = 0;

        function initTrack() {
            roadSegments = [];
            let currentCurve = 0;
            for (let i = 0; i < totalSegments * 2; i++) {
                if (i % 25 === 0) {
                    // Escolhe uma nova direção de curva de forma procedural
                    currentCurve = (Math.random() - 0.5) * 2.2;
                    if (Math.random() < 0.3) currentCurve = 0; // chances de trecho reto
                }
                roadSegments.push({
                    curve: currentCurve,
                    stripeOffset: i * segmentLength
                });
            }
        }

        function resetGame() {
            player.x = 105;
            player.y = 240;
            player.speed = 0;
            scoreDistance = 0;
            roadSpeed = 3;
            obstacles = [];
            enemies = [];
            initTrack();
            gameState = "PLAYING";
        }

        function update() {
            if (gameState !== "PLAYING") {
                if (keys["Enter"] || keys[" "]) resetGame();
                return;
            }

            scoreDistance += Math.floor(roadSpeed);
            distanceDisplay.innerText = scoreDistance;
            speedDisplay.innerText = Math.floor(roadSpeed * 38);

            // Aceleração
            if (keys["ArrowUp"] || keys["w"]) {
                if (roadSpeed < player.maxSpeed) roadSpeed += 0.05;
            } else {
                if (roadSpeed > 2) roadSpeed -= 0.08;
            }
            if (keys["ArrowDown"] || keys["s"]) {
                if (roadSpeed > 1) roadSpeed -= 0.15;
            }

            // Direção do jogador
            if (keys["ArrowLeft"] || keys["a"]) player.x -= player.steerSpeed;
            if (keys["ArrowRight"] || keys["d"]) player.x += player.steerSpeed;

            // Movimento da pista
            trackOffset += roadSpeed;
            if (trackOffset >= segmentLength) {
                trackOffset -= segmentLength;
                roadSegments.pop();
                let lastCurve = roadSegments[0].curve;
                if (Math.random() < 0.05) {
                    lastCurve = (Math.random() - 0.5) * 2.5;
                }
                roadSegments.unshift({ curve: lastCurve, stripeOffset: 0 });
            }

            // Posição atual da pista na altura do jogador
            let playerSegmentIndex = Math.floor((player.y / segmentLength));
            let currentSeg = roadSegments[playerSegmentIndex] || roadSegments[0];
            
            // Calculando limites das bordas com base na curvatura acumulada
            let accumulatedCurve = 0;
            for(let i=0; i<=playerSegmentIndex; i++) {
                accumulatedCurve += roadSegments[i].curve * 1.2;
            }
            
            let currentRoadLeft = baseRoadLeft + accumulatedCurve;
            let currentRoadRight = baseRoadRight + accumulatedCurve;

            // Spawn de Inimigos e Obstáculos Fixos (Cones / Blocos)
            spawnTimer++;
            if (spawnTimer > 40) {
                let spawnX = currentRoadLeft + 15 + Math.random() * (currentRoadRight - currentRoadLeft - 30);
                
                if (Math.random() < 0.4) {
                    // Obstáculo Fixo (Bloco de Concreto / Barreira)
                    obstacles.push({
                        x: spawnX,
                        y: -30,
                        width: 12,
                        height: 10,
                        curveVal: accumulatedCurve
                    });
                } else {
                    // Carro Inimigo
                    enemies.push({
                        x: spawnX,
                        y: -30,
                        width: 14,
                        height: 24,
                        speed: 1.5 + Math.random() * 1.5,
                        color: Math.random() > 0.5 ? "#2196f3" : "#ffeb3b"
                    });
                }
                spawnTimer = 0;
            }

            // Atualizar Obstáculos Fixos
            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.y += roadSpeed;

                // Colisão com obstáculo fixo
                if (
                    player.x < obs.x + obs.width &&
                    player.x + player.width > obs.x &&
                    player.y < obs.y + obs.height &&
                    player.y + player.height > obs.y
                ) {
                    gameState = "GAMEOVER";
                }

                if (obs.y > canvas.height + 30) obstacles.splice(i, 1);
            }

            // Atualizar Carros Inimigos
            for (let i = enemies.length - 1; i >= 0; i--) {
                let en = enemies[i];
                en.y += roadSpeed - en.speed;

                if (
                    player.x < en.x + en.width &&
                    player.x + player.width > en.x &&
                    player.y < en.y + en.height &&
                    player.y + player.height > en.y
                ) {
                    gameState = "GAMEOVER";
                }

                if (en.y > canvas.height + 30) enemies.splice(i, 1);
            }

            // Saída da pista (Grama desacelera e causa batida se bater nas bordas externas extremas)
            if (player.x < currentRoadLeft - 5 || player.x + player.width > currentRoadRight + 5) {
                roadSpeed = Math.max(1.5, roadSpeed - 0.15);
                if (player.x < currentRoadLeft - 15 || player.x + player.width > currentRoadRight + 15) {
                    gameState = "GAMEOVER"; // bateu forte fora da pista
                }
            }
        }

        function drawPixelCar(x, y, colorBody, isPlayer = false) {
            let rx = Math.floor(x);
            let ry = Math.floor(y);

            // Pneus
            ctx.fillStyle = "#111";
            ctx.fillRect(rx - 2, ry + 2, 2, 6);
            ctx.fillRect(rx + 14, ry + 2, 2, 6);
            ctx.fillRect(rx - 2, ry + 16, 2, 6);
            ctx.fillRect(rx + 14, ry + 16, 2, 6);

            // Asas Traseiras
            ctx.fillStyle = "#333";
            ctx.fillRect(rx - 1, ry + 21, 16, 2);

            // Corpo
            ctx.fillStyle = colorBody;
            ctx.fillRect(rx + 2, ry + 4, 10, 16);

            // Bico Dianteiro
            ctx.fillStyle = isPlayer ? "#ffccd5" : "#ddd";
            ctx.fillRect(rx + 4, ry, 6, 4);

            // Cockpit
            ctx.fillStyle = "#111";
            ctx.fillRect(rx + 5, ry + 10, 4, 4);
        }

        function draw() {
            // Fundo (Grama)
            ctx.fillStyle = "#2e7d32";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Desenhar Pista em segmentos para criar efeito de curvas suaves
            let accumulatedCurve = 0;
            for (let i = 0; i < roadSegments.length; i++) {
                let y = i * segmentLength - trackOffset;
                accumulatedCurve += roadSegments[i].curve * 1.2;

                let rLeft = baseRoadLeft + accumulatedCurve;
                let rRight = baseRoadRight + accumulatedCurve;

                // Asfalto
                ctx.fillStyle = "#212121";
                ctx.fillRect(rLeft, y, rRight - rLeft, segmentLength + 1);

                // Zebras Laterais
                ctx.fillStyle = (i % 2 === 0) ? "#f44336" : "#fff";
                ctx.fillRect(rLeft - 3, y, 3, segmentLength + 1);
                ctx.fillRect(rRight, y, 3, segmentLength + 1);

                // Linha Central Tracejada
                if (i % 4 < 2) {
                    ctx.fillStyle = "#fff";
                    ctx.fillRect((rLeft + rRight) / 2 - 1, y, 2, segmentLength + 1);
                }
            }

            // Desenhar Obstáculos Fixos (Blocos de Concreto / Cones)
            for (let obs of obstacles) {
                ctx.fillStyle = "#ff9800"; // Laranja aviso
                ctx.fillRect(Math.floor(obs.x), Math.floor(obs.y), obs.width, obs.height);
                ctx.fillStyle = "#fff";
                ctx.fillRect(Math.floor(obs.x) + 2, Math.floor(obs.y) + 3, obs.width - 4, 2);
            }

            // Desenhar Inimigos
            for (let en of enemies) {
                drawPixelCar(en.x, en.y, en.color, false);
            }

            // Desenhar Jogador
            drawPixelCar(player.x, player.y, "#f44336", true);

            // Telas de Menu e Game Over
            if (gameState === "START") {
                ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#ffeb3b";
                ctx.font = "bold 13px 'Courier New'";
                ctx.textAlign = "center";
                ctx.fillText("F1 CURVAS & OBSTÁCULOS", canvas.width / 2, canvas.height / 2 - 30);

                ctx.fillStyle = "#fff";
                ctx.font = "9px 'Courier New'";
                ctx.fillText("Setas / WASD para pilotar", canvas.width / 2, canvas.height / 2 - 5);
                ctx.fillText("Desvie dos carros e barreiras!", canvas.width / 2, canvas.height / 2 + 10);
                
                ctx.fillStyle = "#4caf50";
                ctx.fillText("Pressione ENTER para Começar", canvas.width / 2, canvas.height / 2 + 40);
                ctx.textAlign = "left";
            } 
            else if (gameState === "GAMEOVER") {
                ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#f44336";
                ctx.font = "bold 16px 'Courier New'";
                ctx.textAlign = "center";
                ctx.fillText("BATIDA!", canvas.width / 2, canvas.height / 2 - 25);

                ctx.fillStyle = "#fff";
                ctx.font = "10px 'Courier New'";
                ctx.fillText(`Distância: ${scoreDistance} m`, canvas.width / 2, canvas.height / 2);

                ctx.fillStyle = "#ffeb3b";
                ctx.fillText("Pressione ENTER p/ Reiniciar", canvas.width / 2, canvas.height / 2 + 30);
                ctx.textAlign = "left";
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        initTrack();
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
