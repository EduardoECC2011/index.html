<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake: Fuga de Thanos</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        h1 {
            margin-bottom: 5px;
            color: #d2a8ff;
            text-shadow: 0 0 10px rgba(163, 113, 247, 0.5);
        }

        p {
            margin-top: 0;
            margin-bottom: 15px;
            color: #8b949e;
        }

        #game-container {
            position: relative;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            border: 4px solid #30363d;
            border-radius: 8px;
            background-color: #0d1117;
        }

        canvas {
            display: block;
        }

        #scoreboard {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <h1>🐍 Fuga do Thanos 🛡️</h1>
    <p>Use as <b>Setas do Teclado</b> para fugir do Thanos e comer as gemas!</p>
    <div id="scoreboard">Pontuação: <span id="score">0</span></div>

    <div id="game-container">
        <canvas id="gameCanvas" width="400" height="400"></canvas>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [
            { x: 10, y: 10 },
            { x: 9, y: 10 },
            { x: 8, y: 10 }
        ];
        let dx = 1;
        let dy = 0;

        let food = { x: 5, y: 5 };
        let thanos = { x: 15, y: 15 };
        let score = 0;
        let gameInterval;
        let isGameOver = false;

        // Controle de teclado
        document.addEventListener("keydown", changeDirection);

        function changeDirection(event) {
            const keyPressed = event.keyCode;
            const LEFT = 37, UP = 38, RIGHT = 39, DOWN = 40;

            const goingUp = dy === -1;
            const goingDown = dy === 1;
            const goingRight = dx === 1;
            const goingLeft = dx === -1;

            if (keyPressed === LEFT && !goingRight) { dx = -1; dy = 0; }
            if (keyPressed === UP && !goingDown) { dx = 0; dy = -1; }
            if (keyPressed === RIGHT && !goingLeft) { dx = 1; dy = 0; }
            if (keyPressed === DOWN && !goingUp) { dx = 0; dy = 1; }
        }

        function main() {
            if (checkGameOver()) {
                isGameOver = true;
                clearInterval(gameInterval);
                drawGameOverScreen();
                return;
            }

            clearCanvas();
            drawFood();
            moveSnake();
            moveThanos();
            drawSnake();
            drawThanos();
        }

        function clearCanvas() {
            ctx.fillStyle = "#0d1117";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Desenhar grade leve de fundo
            ctx.strokeStyle = "#161b22";
            for (let i = 0; i < tileCount; i++) {
                ctx.beginPath();
                ctx.moveTo(i * gridSize, 0);
                ctx.lineTo(i * gridSize, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * gridSize);
                ctx.lineTo(canvas.width, i * gridSize);
                ctx.stroke();
            }
        }

        function drawSnake() {
            snake.forEach((part, index) => {
                // Cabeça da cobra diferente do corpo
                ctx.fillStyle = index === 0 ? "#2ea043" : "#3fb950";
                ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize - 2, gridSize - 2);
            });
        }

        function moveSnake() {
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            snake.unshift(head);

            // Comer comida
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreElement.innerText = score;
                generateFood();
            } else {
                snake.pop();
            }
        }

        function generateFood() {
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);
            // Garantir que a comida não apareça em cima da cobra
            snake.forEach(part => {
                if (part.x === food.x && part.y === food.y) generateFood();
            });
        }

        function drawFood() {
            // Gema do Infinito (comida brilhante)
            ctx.fillStyle = "#58a6ff";
            ctx.beginPath();
            ctx.arc(
                (food.x * gridSize) + gridSize / 2, 
                (food.y * gridSize) + gridSize / 2, 
                gridSize / 2 - 2, 0, 2 * Math.PI
            );
            ctx.fill();
        }

        function moveThanos() {
            // IA simples: Thanos persegue a cabeça da cobra passo a passo
            const head = snake[0];
            
            // Thanos se move a cada X ciclos ou de forma mais lenta/rápida dependendo da lógica. 
            // Aqui ele se move a cada frame junto com a cobra, mas escolhe o eixo de maior distância.
            if (Math.random() < 0.7) { // Deixa o Thanos um pouco mais inteligente/rápido
                if (thanos.x < head.x) thanos.x++;
                else if (thanos.x > head.x) thanos.x--;

                if (thanos.y < head.y) thanos.y++;
                else if (thanos.y > head.y) thanos.y--;
            }
        }

        function drawThanos() {
            // Representando o Thanos como um quadrado roxo com capacete dourado
            ctx.fillStyle = "#8957e5"; // Roxo Thanos
            ctx.fillRect(thanos.x * gridSize, thanos.y * gridSize, gridSize - 2, gridSize - 2);
            
            // Detalhe do elmo dourado
            ctx.fillStyle = "#d29922";
            ctx.fillRect(thanos.x * gridSize + 2, thanos.y * gridSize + 2, gridSize - 6, 4);
        }

        function checkGameOver() {
            const head = snake[0];

            // Colisão com as paredes
            const hitLeftWall = head.x < 0;
            const hitRightWall = head.x >= tileCount;
            const hitToptWall = head.y < 0;
            const hitBottomWall = head.y >= tileCount;

            if (hitLeftWall || hitRightWall || hitToptWall || hitBottomWall) {
                return true;
            }

            // Colisão com o próprio corpo
            for (let i = 1; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    return true;
                }
            }

            // Colisão com o Thanos
            if (head.x === thanos.x && head.y === thanos.y) {
                return true;
            }

            return false;
        }

        function drawGameOverScreen() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#f85149";
            ctx.font = "bold 30px Arial";
            ctx.textAlign = "center";
            ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 15);

            ctx.fillStyle = "#ffffff";
            ctx.font = "16px Arial";
            ctx.fillText("O Thanos te alcançou!", canvas.width / 2, canvas.height / 2 + 15);
            ctx.fillText("Atualize a página para jogar de novo", canvas.width / 2, canvas.height / 2 + 45);
        }

        // Iniciar o jogo
        generateFood();
        gameInterval = setInterval(main, 120); // Velocidade do jogo (quanto menor, mais rápido)
    </script>
</body>
</html>
