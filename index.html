<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 Circuito Livre - Pixel Art</title>
    <style>
        body {
            background-color: #121214;
            color: #e1e1e6;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        h1 {
            margin: 0 0 5px 0;
            color: #f75a68;
            text-shadow: 2px 2px #000;
            font-size: 22px;
        }

        #ui {
            display: flex;
            gap: 20px;
            font-size: 15px;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .hud-item {
            background: #202024;
            padding: 4px 10px;
            border-radius: 4px;
            border: 2px solid #323238;
        }

        #game-container {
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
            border: 4px solid #29292e;
            border-radius: 6px;
            background-color: #388e3c;
        }

        canvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
    </style>
</head>
<body>

    <h1>🏎️ F1 CIRCUITO LIVRE (TOP-DOWN) 🏁</h1>
    <div id="ui">
        <div class="hud-item">Velocidade: <span id="speed">0</span> KM/H</div>
        <div class="hud-item">Voltas: <span id="lap">1</span>/3</div>
    </div>

    <div id="game-container">
        <!-- Tela maior para permitir exploração livre e voltas num circuito fechado -->
        <canvas id="gameCanvas" width="400" height="400"></canvas>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const speedDisplay = document.getElementById("speed");
        const lapDisplay = document.getElementById("lap");

        const keys = {};
        window.addEventListener("keydown", e => keys[e.key] = true);
        window.addEventListener("keyup", e => keys[e.key] = false);

        let gameState = "START"; // START, PLAYING, GAMEOVER, WIN
        let currentLap = 1;
        const maxLaps = 3;

        // Jogador (Com controle livre X e Y)
        let player = {
            x: 200,
            y: 320,
            width: 12,
            height: 20,
            vx: 0,
            vy: 0,
            speed: 0,
            maxSpeed: 5.5,
            accel: 0.1,
            friction: 0.05,
            angle: 0 // Direção para onde o carro aponta
        };

        // Definição do Circuito (Pista oval fechada baseada em pontos centrais e largura)
        // O jogador corre seguindo a pista fechada
        let trackCenterPath = [];
        const trackWidth = 70; // Largura generosa para ultrapassar e andar livremente

        function generateTrack() {
            trackCenterPath = [];
            // Criando uma pista oval com curvas suaves em formato de circuito
            let pointsCount = 120;
            for (let i = 0; i < pointsCount; i++) {
                let angle = (i / pointsCount) * Math.PI * 2;
                // Raio X e Y diferentes formam uma pista oval grande
                let rx = 200 + Math.sin(angle) * 130;
                let ry = 200 + Math.cos(angle) * 130;
                trackCenterPath.x = rx;
                trackCenterPath.y = ry;
            }
        }

        // Obstáculos fixos espalhados pela pista (cones / barreiras)
        let obstacles = [];
        function spawnObstacles() {
            obstacles = [
                { x: 200, y: 70, width: 12, height: 10 },
                { x: 300, y: 200, width: 12, height: 10 },
                { x: 200, y: 330, width: 12, height: 10 },
                { x: 100, y: 200, width: 12, height: 10 }
            ];
        }

        function resetGame() {
            generateTrack();
            spawnObstacles();
            player.x = trackCenterPath.x;
            player.y = trackCenterPath.y + 20;
            player.speed = 0;
            player.angle = -Math.PI / 2;
            currentLap = 1;
            gameState = "PLAYING";
        }

        function update() {
            if (gameState !== "PLAYING") {
                if (keys["Enter"] || keys[" "]) resetGame();
                return;
            }

            // Aceleração e Ré
            if (keys["ArrowUp"] || keys["w"]) {
                if (player.speed < player.maxSpeed) player.speed += player.accel;
            } else if (keys["ArrowDown"] || keys["s"]) {
                if (player.speed > -2) player.speed -= player.accel;
            } else {
                // Atrito natural
                if (player.speed > 0) player.speed -= player.friction;
                if (player.speed < 0) player.speed += player.friction;
            }

            // Direção livre (Esquerda e Direita rotacionam o carro)
            if (keys["ArrowLeft"] || keys["a"]) {
                if (Math.abs(player.speed) > 0.5) player.angle -= 0.04 * (player.speed / player.maxSpeed);
            }
            if (keys["ArrowRight"] || keys["d"]) {
                if (Math.abs(player.speed) > 0.5) player.angle += 0.04 * (player.speed / player.maxSpeed);
            }

            // Movimento baseado no ângulo atual (X e Y livres)
            player.vx = Math.sin(player.angle) * player.speed;
            player.vy = -Math.cos(player.angle) * player.speed;

            player.x += player.vx;
            player.y += player.vy;

            speedDisplay.innerText = Math.floor(Math.abs(player.speed) * 35);
            lapDisplay.innerText = `${currentLap}/${maxLaps}`;

            // Checar se o carro está dentro da pista (verificando proximidade do centro da pista)
            let closestDist = 9999;
            for (let p of trackCenterPath) {
                let dist = Math.hypot(player.x - p.x, player.y - p.y);
                if (dist < closestDist) closestDist = dist;
            }

            // Se sair muito da pista (grama), perde velocidade
            if (closestDist > trackWidth / 2) {
                player.speed *= 0.95; // Freada na grama
                if (closestDist > trackWidth / 2 + 35) {
                    // Saiu totalmente da pista
                    gameState = "GAMEOVER";
                }
            }

            // Checar colisão com obstáculos fixos
            for (let obs of obstacles) {
                if (
                    player.x - player.width/2 < obs.x + obs.width &&
                    player.x + player.width/2 > obs.x &&
                    player.y - player.height/2 < obs.y + obs.height &&
                    player.y + player.height/2 > obs.y
                ) {
                    gameState = "GAMEOVER";
                }
            }

            // Sistema simples de contagem de voltas (passando pelo ponto inicial Y superior)
            let startLine = trackCenterPath;
            if (Math.hypot(player.x - startLine.x, player.y - startLine.y) < 25 && player.speed > 1) {
                // Evitar contagem dupla imediata exigindo que se afaste um pouco antes
            }
        }

        function drawPixelCar(x, y, angle, colorBody) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angle);

            // Pneus
            ctx.fillStyle = "#111";
            ctx.fillRect(-8, -10, 3, 6);
            ctx.fillRect(5, -10, 3, 6);
            ctx.fillRect(-8, 4, 3, 6);
            ctx.fillRect(5, 4, 3, 6);

            // Asa Traseira
            ctx.fillStyle = "#222";
            ctx.fillRect(-7, 8, 14, 2);

            // Corpo
            ctx.fillStyle = colorBody;
            ctx.fillRect(-5, -8, 10, 16);

            // Bico / Asa Dianteira
            ctx.fillStyle = "#ffccd5";
            ctx.fillRect(-3, -12, 6, 4);

            // Cockpit
            ctx.fillStyle = "#111";
            ctx.fillRect(-2, -2, 4, 5);

            ctx.restore();
        }

        function draw() {
            // Fundo (Grama)
            ctx.fillStyle = "#2e7d32";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Desenhar Pista Oval
            ctx.beginPath();
            ctx.strokeStyle = "#212121";
            ctx.lineWidth = trackWidth;
            ctx.lineCap = "round";
            ctx.lineJoin = "round";
            for (let i = 0; i < trackCenterPath.length; i++) {
                let p = trackCenterPath[i];
                if (i === 0) ctx.moveTo(p.x, p.y);
                else ctx.lineTo(p.x, p.y);
            }
            ctx.closePath();
            ctx.stroke();

            // Bordas / Zebras da Pista
            ctx.beginPath();
            ctx.strokeStyle = "#f44336";
            ctx.lineWidth = trackWidth + 4;
            ctx.setLineDash([8, 8]);
            for (let i = 0; i < trackCenterPath.length; i++) {
                let p = trackCenterPath[i];
                if (i === 0) ctx.moveTo(p.x, p.y);
                else ctx.lineTo(p.x, p.y);
            }
            ctx.closePath();
            ctx.stroke();
            ctx.setLineDash([]); // resetar tracejado

            // Redesenhar asfalto por cima para limpar o centro da borda
            ctx.beginPath();
            ctx.strokeStyle = "#262626";
            ctx.lineWidth = trackWidth - 4;
            for (let i = 0; i < trackCenterPath.length; i++) {
                let p = trackCenterPath[i];
                if (i === 0) ctx.moveTo(p.x, p.y);
                else ctx.lineTo(p.x, p.y);
            }
            ctx.closePath();
            ctx.stroke();

            // Linha tracejada central da pista
            ctx.beginPath();
            ctx.strokeStyle = "rgba(255,255,255,0.4)";
            ctx.lineWidth = 2;
            ctx.setLineDash([6, 6]);
            for (let i = 0; i < trackCenterPath.length; i++) {
                let p = trackCenterPath[i];
                if (i === 0) ctx.moveTo(p.x, p.y);
                else ctx.lineTo(p.x, p.y);
            }
            ctx.closePath();
            ctx.stroke();
            ctx.setLineDash([]);

            // Desenhar Obstáculos Fixos
            for (let obs of obstacles) {
                ctx.fillStyle = "#ff9800";
                ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
                ctx.fillStyle = "#fff";
                ctx.fillRect(obs.x + 2, obs.y + 2, obs.width - 4, 3);
            }

            // Desenhar Jogador (Carro Vermelho com movimento livre 360°)
            drawPixelCar(player.x, player.y, player.angle, "#f44336");

            // Telas de Menu / Fim de Jogo
            if (gameState === "START") {
                ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#ffeb3b";
                ctx.font = "bold 14px 'Courier New'";
                ctx.textAlign = "center";
                ctx.fillText("CIRCUITO LIVRE F1", canvas.width / 2, canvas.height / 2 - 30);

                ctx.fillStyle = "#fff";
                ctx.font = "10px 'Courier New'";
                ctx.fillText("Setas / WASD: Dirigir em qualquer direção", canvas.width / 2, canvas.height / 2 - 5);
                ctx.fillText("Mantenha-se dentro da pista!", canvas.width / 2, canvas.height / 2 + 10);
                
                ctx.fillStyle = "#4caf50";
                ctx.fillText("Pressione ENTER para Começar", canvas.width / 2, canvas.height / 2 + 40);
                ctx.textAlign = "left";
            } 
            else if (gameState === "GAMEOVER") {
                ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#f44336";
                ctx.font = "bold 16px 'Courier New'";
                ctx.textAlign = "center";
                ctx.fillText("SAIU DA PISTA / BATEU!", canvas.width / 2, canvas.height / 2 - 20);

                ctx.fillStyle = "#ffeb3b";
                ctx.font = "10px 'Courier New'";
                ctx.fillText("Pressione ENTER p/ Reiniciar", canvas.width / 2, canvas.height / 2 + 15);
                ctx.textAlign = "left";
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        generateTrack();
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
